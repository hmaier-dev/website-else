services:
  traefik:
    image: "traefik:v3.6"
    container_name: "traefik"
    restart: unless-stopped
    command:
      # Static Configuration file
      - "--configFile=/etc/traefik/traefik.yml"
    ports:
      - "80:80"
    labels:
      - "traefik.enable=true"
    volumes:
      - "./traefik.yml:/etc/traefik/traefik.yml:ro"
      ## There are no dynamic rules in this example
      # - "./conf:/etc/traefik/conf:ro"
      ## Mount the docker-socker for label-based configuration
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      ## Certificates
      # - "./certs:/etc/certs:ro"
    networks:
      - traefik-net
  website:
    ## You need to build a version with 
    ## baseURL = "http://localhost/"
    ## earthly +run --tag="local"
    image: "hmaierdev/website-else:local"
    container_name: "website"
    restart: unless-stopped
    depends_on:
      - traefik
      - backend
    environment:
      - NGINX_HOST=localhost
      - NGINX_PORT=80
    networks:
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.website.priority=10"
      - "traefik.http.routers.website.rule=Host(`localhost`) && PathPrefix(`/`)"
      - "traefik.http.routers.website.entrypoints=web"
      ## Verwaltungsseite (/manage, inkl. alter Adresse /events/manage) hinter Authentik
      - "traefik.http.routers.manage-page.priority=25"
      - "traefik.http.routers.manage-page.rule=Host(`localhost`) && (PathPrefix(`/manage`) || PathPrefix(`/events/manage`))"
      - "traefik.http.routers.manage-page.entrypoints=web"
      # - "traefik.http.routers.manage-page.middlewares=authentik@docker"
      # - "traefik.http.routers.website.entrypoints=websecure"
      # - "traefik.http.routers.website.tls=true"
  backend:
    image: "hmaierdev/website-else-backend:local"
    container_name: "backend"
    restart: "unless-stopped"
    depends_on:
      - traefik
    environment:
      - API_USERNAME=highlyVerifiedUserToAdministrate
      - API_PASSWORD=supersecretkey
      ## Shop: Zugangsdaten aus developer.paypal.com (erst Sandbox, dann live)
      - PAYPAL_MODE=sandbox
      - PAYPAL_CLIENT_ID=
      - PAYPAL_CLIENT_SECRET=
      ## Produktkatalog, den Hugo aus content/shop.md erzeugt
      - SHOP_CATALOG_URL=http://website/shop/index.json
      ## Optional: E-Mail bei neuer Anfrage/Bestellung (siehe backend/README.md)
      # - SMTP_HOST=smtp.example.org
      # - SMTP_PORT=587
      # - SMTP_USERNAME=website@elisa-adam.com
      # - SMTP_PASSWORD=
      # - NOTIFY_EMAIL=else@example.org
      ## Header, den Authentik nach dem Login setzt. Nur lokal ohne Authentik leer lassen!
      # - MANAGE_AUTH_HEADER=
    volumes:
      ## This needs be called sqlite.db, its hardcoded
      - ./sqlite.db:/root/sqlite.db
      - "/etc/localtime:/etc/localtime:ro"
    networks:
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.contact.priority=15"
      - "traefik.http.routers.contact.rule=Host(`localhost`) && PathPrefix(`/mailbox`)"
      - "traefik.http.routers.contact.entrypoints=web"
      - "traefik.http.routers.events-load.priority=20"
      - "traefik.http.routers.events-load.rule=Host(`localhost`) && PathPrefix(`/events/load`)"
      - "traefik.http.routers.events-load.entrypoints=web"
      # - "traefik.http.routers.contact.entrypoints=websecure"
      # - "traefik.http.routers.contact.tls=true"
      ## Shop (öffentlich)
      - "traefik.http.routers.shop-api.priority=20"
      - "traefik.http.routers.shop-api.rule=Host(`localhost`) && PathPrefix(`/shop/api`)"
      - "traefik.http.routers.shop-api.entrypoints=web"
      ## Verwaltungs-API hinter Authentik
      - "traefik.http.routers.manage-api.priority=30"
      - "traefik.http.routers.manage-api.rule=Host(`localhost`) && PathPrefix(`/manage/api`)"
      - "traefik.http.routers.manage-api.entrypoints=web"
      # - "traefik.http.routers.manage-api.middlewares=authentik@docker"
      ## Authentik-Middleware (Beispiel, Adresse an euren Outpost anpassen):
      # - "traefik.http.middlewares.authentik.forwardauth.address=http://authentik-server:9000/outpost.goauthentik.io/auth/traefik"
      # - "traefik.http.middlewares.authentik.forwardauth.trustForwardHeader=true"
      # - "traefik.http.middlewares.authentik.forwardauth.authResponseHeaders=X-authentik-username,X-authentik-groups,X-authentik-email"


networks:
  traefik-net:
    name: traefik-net
    driver: bridge
