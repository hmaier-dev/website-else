services:
  traefik:
    image: "traefik:v3.6"
    container_name: "traefik"
    restart: unless-stopped
    command:
      # Static Configuration file
      - "--configFile=/etc/traefik/traefik.yml"
    ports:
      - "80:80"
      - "443:443"
    labels:
      - "traefik.enable=true"
    volumes:
      - "./traefik.yml:/etc/traefik/traefik.yml:ro"
      - "./conf:/etc/traefik/conf:ro"
      ## Mount the docker-socker for label-based configuration
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      ## Certificates
      # - "./certs:/etc/certs:ro"
    networks:
      - traefik-net
  website:
    image: "hmaierdev/website-else"
    container_name: "website"
    restart: unless-stopped
    depends_on:
      - traefik
      - backend
    environment:
      - NGINX_HOST=www.elisa-adam.com
      - NGINX_PORT=80
    networks:
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.website.rule=Host(`elisa-adam.com`) && PathPrefix(`/`)"
      - "traefik.http.routers.website.entrypoints=web"
      # - "traefik.http.routers.website.entrypoints=websecure"
      # - "traefik.http.routers.website.tls=true"
      - "traefik.http.routers.website.priority=15"
  backend:
    image: "hmaierdev/website-else-backend"
    container_name: "backend"
    restart: "unless-stopped"
    depends_on:
      - traefik
    environment:
      - API_USERNAME=highlyVerifiedUserToAdministrate
      - API_PASSWORD=supersecretkey
    volumes:
      ## This needs be called sqlite.db, its hardcoded...
      - "./sqlite.db:/root/sqlite.db"
      - "/etc/localtime:/etc/localtime:ro"
    networks:
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.contact.priority=30"
      - "traefik.http.routers.contact.rule=Host(`elisa-adam.com`) && PathPrefix(`/mailbox`)"
      - "traefik.http.routers.contact.entrypoints=web"
      # - "traefik.http.routers.contact.entrypoints=websecure"
      # - "traefik.http.routers.contact.tls=true"
      - "traefik.http.routers.event-manage.priority=31"
      - "traefik.http.routers.event-manage.rule=Host(`elisa-adam.com`) && PathPrefix(`/events/manage`)"
      - "traefik.http.routers.event-manage.entrypoints=web"
      # - "traefik.http.routers.event-manage.entrypoints=websecure"
      # - "traefik.http.routers.event-manage.tls=true"

networks:
  traefik-net:
    name: traefik-net
    driver: bridge
