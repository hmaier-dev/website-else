# Bildnachweise und Bildbeschreibungen
#
# Pro Foto ein Eintrag. Gilt automatisch überall, wo das Foto auf der Website vorkommt.
#
#   datei:         Pfad unter assets/, genau wie im Inhalt (z. B. media/kreis4.webp)
#   fotograf:      wird klein in der Bildecke angezeigt ("Foto: …") und im Impressum
#                  unter "Bildnachweise" aufgelistet. Leer lassen = keine Angabe.
#   link:          optional, z. B. Website oder Instagram der Fotografin / des Fotografen
#   beschreibung:  was auf dem Foto zu sehen ist. Wird als Alternativtext genutzt
#                  (Screenreader, Suchmaschinen) und bei den Angeboten sowie auf
#                  "Über mich" sichtbar unter dem Bild angezeigt.
#
# Die Beschreibungen unten sind Vorschläge – bitte prüfen und gern Namen ergänzen.
# Fehlt bei einem genutzten Foto der Fotograf, weist der Hugo-Build darauf hin.

