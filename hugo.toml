baseURL = "https://elisa-adam.com/"
# baseURL = "http://localhost/"
locale = "de-DE"

# Keine Schlagwort-/Kategorie-Seiten (werden nicht genutzt; vermeidet die Warnung
# 'found no layout file for "html" for kind "taxonomy"')
disableKinds = ["taxonomy", "term"]

title = "Einfach Else"
disablePathToLower = true

[params]
  description = "Elisa Adam alias Einfach Else: Poetry Slam, Moderation, Workshops und die Late Night Show aus Leipzig."

## Needed for css.TailwindCSS
[[build.cachebusters]]
    source = 'layouts/.*'
    target = 'css'

[markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[markup]
    [markup.highlight]
        style = 'github'

[menus]
  [[menus.main]]
    name = 'Home'
    pageRef = '/'
    weight = 10
  [menus.main.params]
    icon = "home"
  [[menus.main]]
    name = 'Über mich'
    pageRef = '/about-me'
    weight = 20
  [menus.main.params]
    icon = "user"
  [[menus.main]]
    name = 'Events'
    pageRef = '/events/overview'
    weight = 30
  [menus.main.params]
    icon = "kalendar"
  [[menus.main]]
    name = 'Angebote'
    identifier = 'angebote'
    pageRef = '/angebote'
    weight = 40
  [menus.main.params]
    icon = "tools"
  [[menus.main]]
    name = "Jonglieren"
    parent = "angebote"
    url = "/angebote/#jonglierworkshop--jonglieren-lernen-für-anfängerinnen-und-gruppen"
    weight = 1
  [[menus.main]]
    name = "Schreiben"
    parent = "angebote"
    url = "/angebote/#schreibworkshop--kreatives-schreiben-für-einsteigerinnen-und-fortgeschrittene"
    weight = 3

  [[menus.main]]
    name = "Poetry Slam"
    parent = "angebote"
    url = "/angebote/#poetry-slam-workshop--freies-schreiben--performen-lernen"
    weight = 2

  [[menus.main]]
    name = "Moderation"
    parent = "angebote"
    url = "/angebote/#moderationsworkshop--dein-auftritt-auf-der-bühne"
    weight = 4

  [[menus.main]]
    name = "Kinderanimation"
    parent = "angebote"
    url = "/angebote/#kinderanimation--unterhaltung-für-geburtstage-feste--festivals"
    weight = 5

# Neuere Hugo-Versionen führen externe Programme nur noch aus, wenn sie hier erlaubt sind
[security.exec]
  allow = ['^(dart-)?sass(-embedded)?$', '^go$', '^git$', '^node$', '^postcss$', '^tailwindcss$']
