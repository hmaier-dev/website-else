baseURL = "https://elisa-adam.com/"
# baseURL = "http://localhost/"
languageCode = "de-de"
title = "elisa-adam"
disablePathToLower = true

## Needed for css.TailwindCSS
[[build.cachebusters]]
    source = 'layouts/.*'
    target = 'css'

[markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[markup]
    [markup.highlight]
        style = 'github'

