    name = 'home'
    pageRef = '/'
    weight = 10
  [menus.main.params]
    icon = "home"
  [[menus.main]]
    name = 'über-mich'
    pageRef = '/about-me'
    weight = 20
  [menus.main.params]
    icon = "user"
  [[menus.main]]
    name = 'angebote'
