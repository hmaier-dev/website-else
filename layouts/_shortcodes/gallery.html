{{- /*
Load a single image
@examples

  {{< gallery src="/path/to/pic/dir/" >}}

*/}}
{{ $src := .Get "src" }}
{{ $images := resources.Match (printf "%s/**" $src) }}

<div class="gallery max-w-4xl grid grid-flow-col grid-rows-4 gap-3 p-2">
  {{ range $images }}
    {{ if eq .ResourceType "image" }}
      <a
        href="{{ .RelPermalink }}"
        data-fancybox="gallery"
        data-caption=""
        class="block overflow-hidden rounded-md"
      >
        <img
          src="{{ .Resize "400x" }}"
          alt=""
          class="w-full h-40 object-cover transition-transform duration-300 hover:scale-105"
          loading="lazy"
        />
      </a>
    {{ end }}
  {{ end }}
</div>

<!-- Include Fancybox CSS/JS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fancyapps/ui@4.0/dist/fancybox.css" />
<script src="https://cdn.jsdelivr.net/npm/@fancyapps/ui@4.0/dist/fancybox.umd.js"></script>
<script>
  Fancybox.bind("[data-fancybox]", {
    // Your options here
  });
</script>
