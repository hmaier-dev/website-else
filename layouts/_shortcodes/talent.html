{{ $title := .Get "title" }}
{{ $img := cond (.Get "img") (resources.Get (.Get "img")) nil }}

<div class="group">
	<div class="overflow-hidden rounded-xl bg-surface-container-high mb-8 aspect-[4/3] relative">
		<img src="{{ $img.RelPermalink}}" class="m-2 max-sm:w-96 max-sm:h-auto max-sm:m-1 w-full h-full object-cover origin-center inset-0 absolute">
	</div>
	<h4 class="text-2xl font-headline font-bold mb-4 italic">{{ $title }}</h4>
	<p class="text-on-surface-variant leading-relaxed mb-6">
		{{ .Inner | markdownify }}
	</p>
	<div class="flex gap-4">
		<a class="bg-on-surface text-surface px-4 py-2 rounded text-xs font-bold uppercase tracking-widest hover:bg-primary transition-colors" href="#">Shop Gallery</a>
		<a class="border border-outline/30 px-4 py-2 rounded text-xs font-bold uppercase tracking-widest hover:bg-surface-container-high transition-colors" href="#contact">Custom Work</a>
	</div>
</div>
