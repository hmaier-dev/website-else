<!DOCTYPE html>
<html lang="{{ site.Language.Locale }}" dir="{{ or site.Language.Direction `ltr` }}">
	<head>
		{{ partial "head.html" . }}
	</head>
	<body class="min-h-screen flex flex-col">
		<a href="{{ .RelPermalink }}#inhalt" class="sr-only focus:not-sr-only focus:fixed focus:top-3 focus:left-3 focus:z-50 btn-accent">Zum Inhalt springen</a>

		{{ partial "nav.html" . }}

		<main id="inhalt" class="flex-1">
			{{ block "main" . }}{{ end }}
		</main>

		{{ partial "footer.html" . }}
	</body>
</html>
