{{ define "main" }}

<!--This is very dirty and needs to be changed!-->
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.7/dist/htmx.min.js"></script>

  <main class="min-h-[calc(100vh-3rem)] 
    /*keep distance to the nav on small screens*/
    max-sm:mt-16 
    /*keep distance to the nav big screens*/
    sm:ml-48">
    <!--- Why use this--->
    <!--- Whats does this class? Keep all screen in mind and just do small steps---->
    <div class="max-sm:mx-5 sm:mx-10 md:mx-20 lg:mx-30 xl:mx-40 2xl:mx-50">

      {{ .Content }}

      <div class="flex-1 min-w-0">
        <form
          id="events-formular"
          class="w-full md:w-[24rem] lg:w-[28rem]
                 mx-auto md:mx-0
                 p-6 bg-white/70 backdrop-blur-md
                 border border-violet-200
                 rounded-2xl shadow-md"
          hx-post="/events/manage/api/create"
          hx-target="#container-events-all"
          >
          <!-- Datum -->
          <div class="mb-4">
            <label for="datum" class="block text-sm font-medium text-gray-700 mb-1">Datum</label>
            <input
              type="date"
              id="datum"
              name="datum"
              required
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
            >
          </div>

          <!-- Event -->
          <div class="mb-4">
            <label for="event" class="block text-sm font-medium text-gray-700 mb-1">Event</label>
            <input
              type="text"
              id="event"
              name="event"
              required
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
            >
          </div>

          <!-- Ort -->
          <div class="mb-4">
            <label for="ort" class="block text-sm font-medium text-gray-700 mb-1">Ort</label>
            <input
              type="text"
              id="ort"
              name="ort"
              required
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
            >
          </div>

          <!-- Stadt -->
          <div class="mb-4">
            <label for="stadt" class="block text-sm font-medium text-gray-700 mb-1">Stadt</label>
            <input
              type="text"
              id="stadt"
              name="stadt"
              required
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
            >
          </div>

          <!-- Link -->
          <div class="mb-4">
            <label for="link" class="block text-sm font-medium text-gray-700 mb-1">Link</label>
            <input
              type="url"
              id="link"
              name="link"
              required
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
            >
          </div>
          <!-- Submit Button -->
          <button
            type="submit"
            class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 transition duration-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
          >
            Event veröffentlichen
          </button>
        </form>

        <div
          id="container-events-all"
          class=""
          hx-get="/events/manage/api/load/mutable?sort=desc"
          hx-trigger="load"
          hx-swap="innerHTML">
        </div>


      </div>
    </div>
</main>
{{ end }}
