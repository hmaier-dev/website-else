<nav class="fixed top-0 left-0 z-10
            flex flex-col items-center
            h-full w-48 justify-center
            backdrop-blur-md bg-violet-300/70 shadow-lg
            text-lg font-medium text-gray-700
            max-sm:h-16 max-sm:w-full
            max-sm:flex-row max-sm:justify-evenly
            max-sm:items-center max-sm:text-sm max-sm:px-2">

	<ul class="flex flex-col md:items-start sm:items-center gap-3
             max-sm:flex-row max-sm:gap-1 max-sm:w-full max-sm:justify-evenly">
		{{ range site.Menus.main }}
		<li class="max-sm:flex-1">
			<a href="{{ .URL }}" class="nav-link flex items-center gap-2 px-3 py-2 rounded-xl transition-all duration-200 ease-in-out hover:bg-violet-400/30 hover:text-violet-900 max-sm:px-2 max-sm:py-1 max-sm:justify-center">
				<div class="flex items-center gap-1 max-sm:flex-col max-sm:gap-0">
					{{ with .Params.icon }}
					<span class="[&>svg]:w-5 [&>svg]:h-5 max-sm:[&>svg]:w-4 max-sm:[&>svg]:h-4">
						{{ partial "icon.html" . }}
					</span>
					{{ end }}
					<span class="capitalize max-sm:text-[0.75rem]">{{ .Name }}</span>
				</div>
			</a>

			{{ if .HasChildren }}
			<ul data-submenu class="ml-8 mt-1 flex flex-col gap-1 text-base max-sm:hidden">
				{{ range .Children }}
				<li>
					<a href="{{ .URL }}" class="nav-link block px-3 py-1 rounded-lg transition-all duration-200 ease-in-out hover:bg-violet-400/30 hover:text-violet-900">
						{{ .Name }}
					</a>
				</li>
				{{ end }}
			</ul>
			{{ end }}
		</li>
		{{ end }}
	</ul>
</nav>

<script>
	document.addEventListener("DOMContentLoaded", () => {
		const normalize = p => (p.endsWith("/") ? p.slice(0, -1) : p);
		const currentPath = normalize(window.location.pathname);
		
		document.querySelectorAll(".nav-link").forEach(link => {
			if (normalize(link.getAttribute("href")) !== currentPath) return;
			
			link.classList.add("bg-violet-500/40", "text-violet-900");
			
			// If this is a sub point, highlight its parent a bit as well
			const parentLink = link.closest("[data-submenu]")
			?.closest("li")
			?.querySelector(":scope > .nav-link");
			parentLink?.classList.add("bg-violet-400/20", "text-violet-900");
			});
			});
</script>
