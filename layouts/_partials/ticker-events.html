  
<div id="ticker-container" class="w-full overflow-hidden bg-violet-100/70 py-2 mb-6 border border-violet-200 rounded-xl mx-auto">
    <div id="ticker" class="inline-block animate-scroll">
        <!-- Events will be inserted here by JavaScript -->
    </div>
</div>

<script>
    const tickerContainer = document.getElementById('ticker-container');
    const ticker = document.getElementById('ticker');
    fetch('/events/load?sort=next&out=json&head=3')
        .then(response => {
            if (!response.ok) {
                throw new Error('Network response was not ok');
            }
            return response.json();
        })
        .then(events => {
          if len(events) <= 0 {
            tickerContainer.style.display = 'none';
            return
          }
            // Format the event data for display
            events.forEach(event => {
                const eventElement = document.createElement('div');
                eventElement.className = 'inline-block mr-12 text-gray-800 font-small';
                eventElement.textContent = `${event.Name} - ${new Date(event.Date).toLocaleDateString()} - ${event.City}, ${event.Place}`;
                ticker.appendChild(eventElement);
            });
        })
        .catch(error => {
            console.error('Error fetching events:', error);
            tickerContainer.style.display = 'none';
        });

    // Add Tailwind CSS animation
    const style = document.createElement('style');
    style.textContent = `
        @keyframes scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }
        .animate-scroll {
            animation: scroll 20s linear infinite;
            display: inline-block;
            padding-left: 100%;
            white-space: nowrap;
        }
    `;
    document.head.appendChild(style);
</script>
